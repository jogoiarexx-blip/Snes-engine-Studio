<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNES Engine Studio — 1.0.1</title>
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<div class="app">
<header class="top">
  <div class="logo">◆ SNES ENGINE STUDIO</div>
  <div class="project">PROJETO <input id="projectName" value="Meu Jogo"><span id="dirty">●</span></div>
  <span id="gameTypeBadge" class="gameTypeBadge" title="Tipo de jogo">🏃 Plataforma</span>
  <button id="newBtn">Novo</button>
  <button id="saveBtn">💾 Salvar</button>
  <button id="loadBtn">📂 Abrir</button>
  <button id="exportBtn">🌐 HTML</button>
  <button id="exportSnesBtn">🎮 SNES</button>
</header>
<div class="main">
<aside class="left">
<div class="section">EDITOR</div>
<button class="nav active" data-view="map">🗺 Mapas</button>
<button class="nav" data-view="entities">👾 Entidades</button>
<button class="nav" data-view="tilesets">🎨 Tilesets</button>
<button class="nav" data-view="scenes">🎬 Cenas</button>
<button class="nav" data-view="project">⚙ Projeto</button>
<div class="section">CENAS</div><div id="sceneList"></div>
<div class="section">CONTROLES</div>
<div class="card" id="controlsHelp">
  <div class="badge">Mapa: clique pinta · direito apaga</div>
  <div class="badge">Camadas reais · Auto-tile · Undo/Redo</div>
  <div class="badge" id="helpControls">Play: depende do estilo do projeto</div>
</div>
</aside>
<main class="workspace">
<div class="toolbar" id="toolbar">
  <button id="playBtn">▶ TESTAR</button>
  <button id="stopBtn" class="hidden">■ PARAR</button>
  <button id="undoBtn">↶</button>
  <button id="redoBtn">↷</button>
  <button id="clearBtn">Limpar mapa</button>
  <span class="spacer"></span>
  <span id="toolInfo" class="badge">Mapa 32×18 · 16px</span>
  <span id="fpsMeter" class="badge">—</span>
</div>
<div class="canvas-wrap"><canvas id="editor" width="512" height="288"></canvas></div>
<div class="bottom">
  <span id="status">Pronto.</span>
  <span class="spacer"></span>
  <span>SNES Engine Studio · 1.0.1 · Cutscenes · UI · Tiles · Prefabs · Game Flow</span>
</div>
</main>
<aside class="right" id="rightPanel"></aside>
</div></div>
<div id="modal" class="modal hidden"><div><div id="modalBody"></div><div style="display:flex;justify-content:flex-end;gap:7px;margin-top:10px"><button id="modalClose">Fechar</button></div></div></div>
