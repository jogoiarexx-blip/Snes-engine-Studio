<!doctype html><meta charset="utf-8"><title>Browser Integration</title><div id="result">BROWSER_PENDING</div>
<script src="../js/engine/event-bus.js"></script><script src="../js/storage/storage-hub.js"></script><script src="../js/engine/collision-layers.js"></script><script src="../js/engine/entity-components.js"></script><script src="../js/engine/entity-world.js"></script><script src="../js/editor/command-manager.js"></script><script src="../js/game/state-machine.js"></script><script src="../js/engine/tilemap.js"></script>
<script>
(async()=>{const out=document.getElementById('result');try{const e={id:'e',type:'enemy',x:1,y:2,hp:3,maxHp:3,damage:1,speed:20};SNESEntityComponents.ensure(e);e.hp=2;e.x=9;if(e.components.health.current!==2||e.components.transform.x!==9)throw Error('components');const w=SNESEntityWorld.create({entities:[e]}),more=[{id:'e2',type:'enemy',hp:1}];w.attachCollection('enemies',more);if(w.query('enemy').length!==2)throw Error('world');const m=SNESCommands.create(),o={v:1};m.execute(SNESCommands.property(o,'v',2));m.undo();if(o.v!==1)throw Error('undo');m.redo();if(o.v!==2)throw Error('redo');SNESStorage.preferences.set('browser_test',{x:7});if(SNESStorage.preferences.get('browser_test').x!==7)throw Error('storage');const sm=SNESGameStateMachine.create({});sm.register('menu',{}).register('play',{});await sm.change('menu');await sm.change('play');if(sm.name!=='play')throw Error('state');const s={map:Array.from({length:18},()=>Array(32).fill(0))};SNESTileMap.normalizeScene(s);SNESTileMap.getChunk(s,0,0).layers.ground[1][1]=4;if(s.map[1][1]!==4)throw Error('tilemap');out.textContent='BROWSER_PASS'}catch(e){out.textContent='BROWSER_FAIL '+e.message}})();
</script>
