<!doctype html><meta charset="utf-8"><title>E2E</title><div id="result">E2E_PENDING</div><iframe id="app" src="../index.html" style="width:800px;height:600px"></iframe><script>
const out=document.getElementById('result'),fail=m=>{out.textContent='E2E_FAIL '+m};
async function run(){try{const w=document.getElementById('app').contentWindow;await new Promise(r=>setTimeout(r,1400));const A=w.SNESStudio;if(!A)throw Error('SNESStudio ausente');if(A.project.schemaVersion!==10)throw Error('schema');const s=A.scene();if(!s||!w.SNESTileMap)throw Error('tilemap');const ch=w.SNESTileMap.getChunk(s,0,0,true);ch.layers.ground[1][1]=5;if(s.map[1][1]!==5)throw Error('tilemap alias');const e=(s.entities||[])[0]||{id:'t',type:'enemy',hp:3,x:1,y:2};if(!s.entities.length)s.entities.push(e);w.SNESEntityComponents.ensure(e);e.hp=2;if(e.components.health.current!==2)throw Error('component bridge hp');e.x=42;if(e.components.transform.x!==42)throw Error('component bridge x');const world=w.SNESEntityWorld.create({entities:[e]}),extra=[{id:'x',type:'enemy',components:{health:{current:1,max:1}}}];world.attachCollection('enemies',extra);if(world.query('enemy').length<2)throw Error('entity world collections');const o={x:1},mgr=w.SNESCommands.create();mgr.execute(w.SNESCommands.property(o,'x',2));mgr.undo();if(o.x!==1)throw Error('undo');mgr.redo();if(o.x!==2)throw Error('redo');w.SNESStorage.preferences.set('e2e',{ok:1});if(w.SNESStorage.preferences.get('e2e').ok!==1)throw Error('storage');const sm=w.SNESGameStateMachine.create({});sm.register('a',{}).register('b',{});await sm.change('a');await sm.change('b');if(sm.name!=='b')throw Error('state machine');out.textContent='E2E_PASS'}catch(e){fail(e.message)}}
document.getElementById('app').addEventListener('load',run);
</script>
