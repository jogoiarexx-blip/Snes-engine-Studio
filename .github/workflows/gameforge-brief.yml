name: GameForge Brief - SNES
on:
  push:
    paths:
      - 'js/editor/gameforge-brief.js'
      - 'js/editor/project-wizard.js'
      - 'tests/gameforge-brief.test.js'
      - '.github/workflows/gameforge-brief.yml'
  pull_request:
    paths:
      - 'js/editor/gameforge-brief.js'
      - 'js/editor/project-wizard.js'
      - 'tests/gameforge-brief.test.js'
      - '.github/workflows/gameforge-brief.yml'
jobs:
  brief-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/editor/gameforge-brief.js
      - run: node --check js/editor/project-wizard.js
      - run: node tests/gameforge-brief.test.js
